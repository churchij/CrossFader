<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YTXfade</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1 class="brand"><img src="assets/ytxfade-brand.png" alt="YTXfade" width="320" height="320"></h1>
  <p class="intro">Blend the outgoing song into the next with two real players.</p>
  <label for="seconds">Crossfade length <output id="length" for="seconds">5 seconds</output></label>
  <input id="seconds" type="range" min="1" max="12" value="5" step="1">
  <button id="toggle" disabled>Loading…</button>
  <p id="status" role="status" aria-live="polite">Checking playback…</p>
  <button id="companion" class="secondary" hidden>Open companion tab</button>
  <label class="preference"><input id="showControls" type="checkbox" checked> Show on-page controls</label>
  <p class="note">Experimental · Premium recommended. Keep the companion tab open. Enable on the tab playing your queue. Manual skips use ordinary playback.</p>
  <script src="core.js"></script><script src="popup.js"></script>
</body></html>
